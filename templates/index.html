<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>To-Do Cloud — Список задач с облачным хранением файлов</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>📝 Список задач</h1>
            <p class="subtitle">
                Проект по курсу «Технологии облачных вычислений»:<br>
                <strong>«Список задач (To-Do) с облачным хранением файлов-вложений»</strong>
            </p>
        </header>

        <form id="add-form" class="add-form">
            <input id="title" type="text" placeholder="Что нужно сделать?" required autocomplete="off">
            <button type="submit">Добавить</button>
        </form>

        <div class="toolbar">
            <input id="search" type="text" placeholder="🔍 Поиск по названию…" autocomplete="off">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="active">Активные</button>
                <button class="filter-btn" data-filter="done">Выполненные</button>
            </div>
        </div>

        <p class="stats">
            Всего: <span id="count-total">0</span> ·
            Выполнено: <span id="count-done">0</span> ·
            Осталось: <span id="count-active">0</span>
        </p>

        <ul id="task-list" class="task-list"></ul>
        <p id="empty" class="empty hidden">Задач не найдено</p>

        <footer class="app-footer">
            Стек: Flask · MongoDB · Dropbox API · Docker · Heroku/Render
        </footer>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
